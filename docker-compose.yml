services:
  redis:
    image: redis:7-alpine
    container_name: redis-learning
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  mongo:
      image: mongo:7-jammy
      container_name: chai-aur-mongo
      ports:
        - "27017:27017"
      environment:
        MONGO_INITDB_DATABASE: redis_learning
      volumes:
        - mongo_data:/data/db

volumes:
  redis_data:
  mongo_data: